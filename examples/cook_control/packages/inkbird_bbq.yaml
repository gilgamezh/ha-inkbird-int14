automation:
- id: inkbird_bbq_probe_reached_target
  alias: BBQ probe reached target
  description: Notifies when a BBQ probe reaches its target temperature.
  triggers:
  - trigger: state
    entity_id: sensor.bbq_probe_1_status
    to: ready
    for: 00:00:30
    id: '1'
  - trigger: state
    entity_id: sensor.bbq_probe_2_status
    to: ready
    for: 00:00:30
    id: '2'
  - trigger: state
    entity_id: sensor.bbq_probe_3_status
    to: ready
    for: 00:00:30
    id: '3'
  - trigger: state
    entity_id: sensor.bbq_probe_4_status
    to: ready
    for: 00:00:30
    id: '4'
  actions:
  - variables:
      prefix: |
        {% set p = states('input_text.inkbird_sensor_prefix') %} {{ p if p not in ['unknown', 'unavailable', ''] else 'sensor.' ~ 'inkbird_example' }}
      idx: '{{ trigger.id }}'
      snooze: '{{ states(''input_number.bbq_snooze_minutes'') | int(10) }}'
      pname: '{{ states(''input_text.inkbird_name_'' ~ trigger.id) }}'
      ptemp: '{{ states(''sensor.bbq_probe_'' ~ trigger.id ~ ''_control_temperature'') | float(0) | round(1) }}'
      ptarget: '{{ states(''input_number.inkbird_target_'' ~ trigger.id) | float(0) | round(0) }}'
      italian: '{{ is_state(''input_select.bbq_language'', ''Italiano'') }}'
  - action: input_text.set_value
    target:
      entity_id: '{{ ''input_text.bbq_last_alert_'' ~ trigger.id }}'
    data:
      value: '{{ session_key }}'
  - event: inkbird_bbq_target_reached
    event_data:
      probe: '{{ trigger.id | int }}'
  - action: script.bbq_notify
    data:
      title: 'BBQ: {{ pname }}, {{ ''soglia raggiunta'' if italian else ''HA target reached'' }}'
      message: '{{ ''Sonda'' if italian else ''Probe'' }} {{ idx }}: {{ ptemp }} C. {{ ''Soglia HA'' if italian
        else ''HA target'' }} {{ ptarget }} C.'
      tts_message: '{{ pname }}. {{ ''Soglia raggiunta. La sonda misura'' if italian else ''HA target reached. Probe
        temperature is'' }} {{ ptemp }} {{ ''gradi Celsius'' if italian else ''degrees Celsius'' }}.'
      tag: inkbird_ready_{{ idx }}
      actions:
      - action: BBQ_SNOOZE_{{ idx }}
        title: Snooze {{ snooze }} min
      - action: BBQ_DISMISS_{{ idx }}
        title: Dismiss
  mode: parallel
  conditions:
  - condition: template
    value_template: '{{ is_state(''input_boolean.bbq_probe_'' ~ trigger.id ~ ''_enabled'', ''on'') and is_state(''sensor.bbq_probe_''
      ~ trigger.id ~ ''_status'', ''ready'') }}'
  - condition: template
    value_template: '{{ states(''input_text.bbq_last_alert_'' ~ trigger.id) != session_key }}'
  variables:
    session_key: '{{ [as_timestamp(states[''input_boolean.bbq_probe_'' ~ trigger.id ~ ''_enabled''].last_changed),
      as_timestamp(states[''input_text.inkbird_name_'' ~ trigger.id].last_changed), as_timestamp(states[''input_number.inkbird_target_''
      ~ trigger.id].last_changed), as_timestamp(states.input_text.inkbird_sensor_prefix.last_changed)] | join('':'')
      }}'
- id: inkbird_bbq_rest_reminder
  alias: BBQ rest reminder
  description: Optional reminder measured from the HA target, not from removal from heat.
  triggers:
  - trigger: event
    event_type: inkbird_bbq_target_reached
    event_data:
      probe: 1
    id: '1'
  - trigger: event
    event_type: inkbird_bbq_target_reached
    event_data:
      probe: 2
    id: '2'
  - trigger: event
    event_type: inkbird_bbq_target_reached
    event_data:
      probe: 3
    id: '3'
  - trigger: event
    event_type: inkbird_bbq_target_reached
    event_data:
      probe: 4
    id: '4'
  conditions:
  - condition: numeric_state
    entity_id: input_number.bbq_rest_minutes
    above: 0
  - condition: template
    value_template: '{{ is_state(''input_boolean.bbq_probe_'' ~ trigger.id ~ ''_enabled'', ''on'') }}'
  actions:
  - action: script.turn_on
    target:
      entity_id: '{{ ''script.bbq_rest_'' ~ trigger.id }}'
  mode: parallel
- id: inkbird_bbq_probe_battery_low
  alias: BBQ probe battery low
  description: |
    Warns when a probe battery drops below the threshold set on the dashboard's Settings page. Toggled by input_boolean.bbq_battery_alerts.
  triggers:
  - trigger: template
    value_template: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set b = states(p ~ '_probe_1_battery') | float(none) %}
      {{ b is not none and b >= 0 and b < states('input_number.bbq_battery_threshold') | float(0) and is_state('input_boolean.bbq_battery_alerts', 'on') and is_state('input_boolean.bbq_probe_1_enabled', 'on') and states('sensor.bbq_probe_1_status') in ['heating','close','ready'] and not is_state(p | replace('sensor.', 'binary_sensor.') ~ '_probe_battery_report_suspect', 'on') }}
    id: '1'
  - trigger: template
    value_template: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set b = states(p ~ '_probe_2_battery') | float(none) %}
      {{ b is not none and b >= 0 and b < states('input_number.bbq_battery_threshold') | float(0) and is_state('input_boolean.bbq_battery_alerts', 'on') and is_state('input_boolean.bbq_probe_2_enabled', 'on') and states('sensor.bbq_probe_2_status') in ['heating','close','ready'] and not is_state(p | replace('sensor.', 'binary_sensor.') ~ '_probe_battery_report_suspect', 'on') }}
    id: '2'
  - trigger: template
    value_template: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set b = states(p ~ '_probe_3_battery') | float(none) %}
      {{ b is not none and b >= 0 and b < states('input_number.bbq_battery_threshold') | float(0) and is_state('input_boolean.bbq_battery_alerts', 'on') and is_state('input_boolean.bbq_probe_3_enabled', 'on') and states('sensor.bbq_probe_3_status') in ['heating','close','ready'] and not is_state(p | replace('sensor.', 'binary_sensor.') ~ '_probe_battery_report_suspect', 'on') }}
    id: '3'
  - trigger: template
    value_template: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set b = states(p ~ '_probe_4_battery') | float(none) %}
      {{ b is not none and b >= 0 and b < states('input_number.bbq_battery_threshold') | float(0) and is_state('input_boolean.bbq_battery_alerts', 'on') and is_state('input_boolean.bbq_probe_4_enabled', 'on') and states('sensor.bbq_probe_4_status') in ['heating','close','ready'] and not is_state(p | replace('sensor.', 'binary_sensor.') ~ '_probe_battery_report_suspect', 'on') }}
    id: '4'
  conditions:
  - condition: state
    entity_id: input_boolean.bbq_battery_alerts
    state: 'on'
  - condition: template
    value_template: '{{ is_state(''input_boolean.bbq_probe_'' ~ trigger.id ~ ''_enabled'', ''on'') }}'
  actions:
  - variables:
      idx: '{{ trigger.id }}'
      pname: '{{ states(''input_text.inkbird_name_'' ~ trigger.id) }}'
      pct: |
        {% set p = states('input_text.inkbird_sensor_prefix') %} {% set p = p if p not in ['unknown', 'unavailable', ''] else 'sensor.' ~ 'inkbird_example' %} {{ states(p ~ '_probe_' ~ trigger.id ~ '_battery') }}
  - action: script.bbq_notify
    data:
      title: 🪫 Probe {{ idx }} battery low
      message: '{{ pname }} is at {{ pct }}%. Swap or charge the probe before it quits mid-cook.'
      tts_message: Warning. The battery on probe {{ idx }} is at {{ pct }} percent.
      tag: inkbird_battery_{{ idx }}
  mode: parallel
- id: inkbird_bbq_probe_stalled
  alias: BBQ probe stalled
  description: |
    Fires when a probe's rate of change sits between -1 and +1 °C/h for 45 minutes while still below target. Toggled by input_boolean.bbq_stall_alerts.
  triggers:
  - trigger: template
    id: '1'
    for: 00:45:00
    value_template: |-
      {% set rate = states('sensor.bbq_probe_1_rate') | float(none) %}
      {{ rate is not none and -1 < rate < 1 and is_state('input_boolean.bbq_stall_alerts', 'on') and is_state('sensor.bbq_probe_1_status', 'heating') and is_state('input_boolean.bbq_probe_1_enabled', 'on') }}
  - trigger: template
    id: '2'
    for: 00:45:00
    value_template: |-
      {% set rate = states('sensor.bbq_probe_2_rate') | float(none) %}
      {{ rate is not none and -1 < rate < 1 and is_state('input_boolean.bbq_stall_alerts', 'on') and is_state('sensor.bbq_probe_2_status', 'heating') and is_state('input_boolean.bbq_probe_2_enabled', 'on') }}
  - trigger: template
    id: '3'
    for: 00:45:00
    value_template: |-
      {% set rate = states('sensor.bbq_probe_3_rate') | float(none) %}
      {{ rate is not none and -1 < rate < 1 and is_state('input_boolean.bbq_stall_alerts', 'on') and is_state('sensor.bbq_probe_3_status', 'heating') and is_state('input_boolean.bbq_probe_3_enabled', 'on') }}
  - trigger: template
    id: '4'
    for: 00:45:00
    value_template: |-
      {% set rate = states('sensor.bbq_probe_4_rate') | float(none) %}
      {{ rate is not none and -1 < rate < 1 and is_state('input_boolean.bbq_stall_alerts', 'on') and is_state('sensor.bbq_probe_4_status', 'heating') and is_state('input_boolean.bbq_probe_4_enabled', 'on') }}
  conditions:
  - condition: state
    entity_id: input_boolean.bbq_stall_alerts
    state: 'on'
  - condition: template
    value_template: '{{ is_state(''sensor.bbq_probe_'' ~ trigger.id ~ ''_status'', ''heating'') }}'
  - condition: template
    value_template: '{{ is_state(''input_boolean.bbq_probe_'' ~ trigger.id ~ ''_enabled'', ''on'') }}'
  actions:
  - variables:
      prefix: |
        {% set p = states('input_text.inkbird_sensor_prefix') %} {{ p if p not in ['unknown', 'unavailable', ''] else 'sensor.' ~ 'inkbird_example' }}
      idx: '{{ trigger.id }}'
      pname: '{{ states(''input_text.inkbird_name_'' ~ trigger.id) }}'
      ptemp: '{{ states(''sensor.bbq_probe_'' ~ trigger.id ~ ''_control_temperature'') | round(1) }}'
      ptarget: '{{ states(''input_number.inkbird_target_'' ~ trigger.id) | round(0) }}'
  - action: script.bbq_notify
    data:
      title: 'BBQ: {{ pname }}, slow temperature change'
      message: Probe {{ idx }} has changed by less than 1 C/hour for 45 minutes while below its HA target. Check
        the cook.
      tts_message: '{{ pname }}. Slow temperature change. Check the cook.'
      tag: inkbird_stall_{{ idx }}
  mode: parallel
- id: inkbird_bbq_sync_media_targets
  alias: BBQ sync media targets
  description: |
    Refills input_select.bbq_tts_speaker / _engine from the media_player and tts entities that currently exist. Runs at startup and hourly.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: /1
  actions:
  - action: script.bbq_refresh_media_targets
  mode: single
- id: inkbird_bbq_notification_action
  alias: BBQ notification action
  description: Handles the Snooze / Dismiss buttons on a BBQ notification.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.action | default('''') is string and trigger.event.data.action | default('''')
      | regex_match(''^BBQ_(SNOOZE|DISMISS)_[1-4]$'') }}'
  actions:
  - variables:
      prefix: |
        {% set p = states('input_text.inkbird_sensor_prefix') %} {{ p if p not in ['unknown', 'unavailable', ''] else 'sensor.' ~ 'inkbird_example' }}
      parts: '{{ trigger.event.data.action.split(''_'') }}'
      kind: '{{ parts[1] }}'
      idx: '{{ parts[2] }}'
      notify_target: |
        {% set configured = states('input_text.bbq_notify_service') %} {{ configured if configured not in ['unknown', 'unavailable', '']
           else states('input_select.bbq_notify_target') }}
  - action: persistent_notification.dismiss
    data:
      notification_id: inkbird_ready_{{ idx }}
  - if:
    - condition: template
      value_template: |
        {{ notify_target.startswith('mobile_app_')
           and notify_target | regex_match('^[a-z0-9_]+$') }}
    then:
    - action: '{{ ''notify.'' ~ notify_target }}'
      continue_on_error: true
      data:
        message: clear_notification
        data:
          tag: inkbird_ready_{{ idx }}
  - choose:
    - conditions: '{{ kind == ''SNOOZE'' and is_state(''sensor.bbq_probe_'' ~ idx ~ ''_status'', ''ready'') }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: '{{ ''script.bbq_snooze_'' ~ idx }}'
    default:
    - action: script.turn_off
      target:
        entity_id: '{{ [''script.bbq_snooze_'' ~ idx, ''script.bbq_rest_'' ~ idx] }}'
  mode: queued
  max: 20
- id: inkbird_bbq_cancel_pending
  alias: BBQ cancel pending reminders
  mode: queued
  max: 30
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.bbq_probe_1_enabled
    - input_text.inkbird_name_1
    - input_number.inkbird_target_1
    id: '1'
  - trigger: state
    entity_id: sensor.bbq_probe_1_status
    from: ready
    id: '1'
  - trigger: state
    entity_id:
    - input_boolean.bbq_probe_2_enabled
    - input_text.inkbird_name_2
    - input_number.inkbird_target_2
    id: '2'
  - trigger: state
    entity_id: sensor.bbq_probe_2_status
    from: ready
    id: '2'
  - trigger: state
    entity_id:
    - input_boolean.bbq_probe_3_enabled
    - input_text.inkbird_name_3
    - input_number.inkbird_target_3
    id: '3'
  - trigger: state
    entity_id: sensor.bbq_probe_3_status
    from: ready
    id: '3'
  - trigger: state
    entity_id:
    - input_boolean.bbq_probe_4_enabled
    - input_text.inkbird_name_4
    - input_number.inkbird_target_4
    id: '4'
  - trigger: state
    entity_id: sensor.bbq_probe_4_status
    from: ready
    id: '4'
  - trigger: state
    entity_id: input_text.inkbird_sensor_prefix
    id: all
  actions:
  - action: script.turn_off
    target:
      entity_id: '{{ [''script.bbq_snooze_1'', ''script.bbq_rest_1'', ''script.bbq_snooze_2'', ''script.bbq_rest_2'',
        ''script.bbq_snooze_3'', ''script.bbq_rest_3'', ''script.bbq_snooze_4'', ''script.bbq_rest_4''] if trigger.id
        == ''all'' else [''script.bbq_snooze_'' ~ trigger.id, ''script.bbq_rest_'' ~ trigger.id] }}'
